services:
  # ── MySQL Database ──────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: JunubiRoot2026!
      MYSQL_DATABASE: junubi_tech
      MYSQL_USER: junubi
      MYSQL_PASSWORD: JunubiPass2026!
    volumes:
      - mysql_data:/var/lib/mysql

  # ── Backend API ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    command: node server.js
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: junubi
      DB_PASSWORD: JunubiPass2026!
      DB_NAME: junubi_tech
      JWT_SECRET: JunubiJWT2026SuperSecret!
    depends_on:
      - mysql

  # ── Frontend (nginx production build) ───────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    depends_on:
      - backend

volumes:
  mysql_data:
