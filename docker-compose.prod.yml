services:
  # ── MySQL Database ──────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
      MYSQL_DATABASE: ${DB_NAME:-junubi_tech}
      MYSQL_USER: ${DB_USER:-junubi}
      MYSQL_PASSWORD: ${DB_PASSWORD:-junubi_secret}
    volumes:
      - mysql_data:/var/lib/mysql

  # ── Backend API ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER:-junubi}
      DB_PASSWORD: ${DB_PASSWORD:-junubi_secret}
      DB_NAME: ${DB_NAME:-junubi_tech}
      JWT_SECRET: ${JWT_SECRET:-supersecret_jwt_key_change_in_production}
    depends_on:
      - mysql

  # ── Frontend Nginx ──────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80"

volumes:
  mysql_data:
